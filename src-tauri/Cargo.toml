[package]
name = "mygh"
version = "0.1.1"
description = "MMGH Agent Desktop"
authors = [ "Codex" ]
license = ""
repository = ""
default-run = "mygh"
edition = "2021"
build = "src/build.rs"

[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = [ "derive" ] }
tauri = { version = "2", features = [ "tray-icon" ] }
anyhow = "1.0"
once_cell = "1.21"
rusqlite = { version = "0.40", features = [ "bundled" ] }
reqwest = { version = "0.13", default-features = false, features = [ "json", "rustls" ] }
keyring = "4"
rig = { version = "0.44", default-features = false, features = ["agent", "derive", "reqwest", "rustls"] }

[dev-dependencies]
tokio = { version = "1", features = [ "rt", "macros" ] }

[build-dependencies]
tauri-build = { version = "2", features = [] }

[[bin]]
name = "mygh"
path = "src/main.rs"
